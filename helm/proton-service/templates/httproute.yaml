{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "proton-service.fullname" . }}
  labels:
    {{- include "proton-service.labels" . | nindent 4 }}
spec:
  parentRefs:
  {{- range .Values.gateway.parentRefs }}
  - name: {{ .name }}
    {{- with .namespace }}
    namespace: {{ . }}
    {{- end }}
  {{- end }}
  hostnames:
  {{- range .Values.gateway.hostnames }}
  - {{ . | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "proton-service.fullname" . }}
      port: {{ $.Values.service.port }}
{{- end }}
