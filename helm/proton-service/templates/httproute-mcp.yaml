{{- if and .Values.mcp.enabled .Values.mcp.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "proton-service.fullname" . }}-mcp
  labels:
    {{- include "proton-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
  {{- range .Values.mcp.gateway.parentRefs }}
  - name: {{ .name }}
    {{- with .namespace }}
    namespace: {{ . }}
    {{- end }}
  {{- end }}
  hostnames:
  {{- range .Values.mcp.gateway.hostnames }}
  - {{ . | quote }}
  {{- end }}
  rules:
  - backendRefs:
    - name: {{ include "proton-service.fullname" . }}-mcp
      port: {{ $.Values.mcp.port }}
{{- end }}
