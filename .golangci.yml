version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - gosec
    - unconvert
    - unparam
    - prealloc

  settings:
    gosec:
      excludes:
        - G101
        - G104
        - G114
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
